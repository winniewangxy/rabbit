<title>小妍与蓝兔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: phone-first app column; a sticker "photo frame" stage sits above a dialogue card, like a pocket visual novel */
:root{
  --rose:#f6d4d5; --rose-2:#fbe6e5; --frame:#f3cecf; --paper:#fffaf8;
  --berry:#e7849b; --berry-d:#c75f7a; --cocoa:#5b3b3e; --cocoa-2:#94706f;
  --sky:#a8c5ee; --sky-d:#5c8bd0; --butter:#ffe39a; --line:#f1c3c9;
  --f-display:'ZCOOL KuaiLe','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --f-body:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;background:var(--rose);color:var(--cocoa);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px}
.ic{width:1em;height:1em;vertical-align:-.12em;fill:currentColor}

#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;background:linear-gradient(#fbe3e3,#f6d0d3)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 14px;gap:12px}
.screen.scroll{overflow-y:auto}

/* shared bar */
.bar{display:flex;align-items:center;gap:10px;min-height:40px;position:relative;z-index:3}
.chip{background:color-mix(in srgb,var(--paper) 88%,transparent);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--cocoa);box-shadow:0 2px 0 #f0bcc5}
button.chip:active{transform:translateY(1px);box-shadow:none}
.bar .grow{flex:1;min-width:0}
.ttl{font-family:var(--f-display);font-size:20px;letter-spacing:.04em;text-wrap:balance}

/* buttons */
.btn{font-family:var(--f-display);font-size:18px;letter-spacing:.06em;padding:13px 20px;border-radius:18px;background:var(--berry);color:#fff;box-shadow:0 4px 0 var(--berry-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--berry-d)}
.btn.soft{background:var(--paper);color:var(--cocoa);box-shadow:0 4px 0 var(--line);border:1.5px solid var(--line)}
.btn.sky{background:var(--sky-d);box-shadow:0 4px 0 #3f6eb3}
.btn[disabled]{opacity:.5;pointer-events:none}

/* frame */
.frame{position:relative;width:min(84%,44vh,360px);aspect-ratio:1/1;margin:0 auto;border-radius:34px;background:radial-gradient(circle at 50% 45%,#f7d9d9,var(--frame) 70%);border:6px solid #fff;box-shadow:0 10px 30px rgba(150,70,90,.18),0 2px 0 #f2c2cb;display:grid;place-items:center;overflow:hidden;flex:none}
.frame img{width:100%;height:100%;object-fit:contain}
.frame.solo{background:transparent;border-color:transparent;box-shadow:none;overflow:visible}
.frame.solo img{width:78%;height:78%;filter:drop-shadow(0 8px 10px rgba(90,60,120,.18))}
.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.86);opacity:.2}to{transform:none;opacity:1}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* backgrounds */
.stage{transition:background .8s}
[data-bg=rain]{background:linear-gradient(#c9bed9,#ecd2da)}
[data-bg=morning]{background:linear-gradient(#ffe8c4,#ffd2d4)}
[data-bg=street]{background:linear-gradient(#ffc8ae,#f5b3c4)}
[data-bg=desk]{background:radial-gradient(circle at 80% 15%,#fff2c9 0,transparent 35%),linear-gradient(#c3b6de,#e8c5d6)}
[data-bg=music]{background:linear-gradient(#d6c6f2,#f4cbe0)}
[data-bg=night]{background:linear-gradient(#37336a,#7d6b9b)}
[data-bg=love]{background:linear-gradient(#ffc0cf,#ffe2e8)}
.decor{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.decor i{position:absolute;font-style:normal;opacity:.7;animation:float 9s linear infinite}
@keyframes float{from{transform:translateY(20px) rotate(0)}to{transform:translateY(-110vh) rotate(25deg)}}
.decor .rain{inset:-20% 0 0 0;background:repeating-linear-gradient(105deg,transparent 0 18px,rgba(255,255,255,.45) 18px 19px,transparent 19px 46px);animation:rain .7s linear infinite;opacity:.6}
@keyframes rain{to{transform:translate(-14px,46px)}}
.decor .tw{width:3px;height:3px;border-radius:50%;background:#fff6c8;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.screen>*:not(.decor){position:relative;z-index:1}

/* title */
#title{align-items:center;justify-content:center;text-align:center;gap:18px}
#title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,11vw,56px);margin:0;color:var(--berry-d);letter-spacing:.06em;text-shadow:0 3px 0 #fff}
#title p{margin:0;color:var(--cocoa-2);max-width:22em;line-height:1.7}
#title .acts{display:flex;flex-direction:column;gap:12px;width:min(100%,280px)}
.title-art{position:relative;width:min(80%,42vh,340px)}
.title-art .frame{width:100%}
.title-art .peek{position:absolute;width:38%;right:-12%;bottom:-8%;filter:drop-shadow(0 6px 8px rgba(80,60,120,.2))}

/* story */
#stTitle{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#story{padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.st-mid{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.dialog{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px 18px 18px;min-height:128px;box-shadow:0 6px 0 #efbcc6,0 14px 30px rgba(120,50,70,.12);cursor:pointer}
.who{position:absolute;top:-16px;left:16px;font-family:var(--f-display);font-size:16px;padding:4px 14px 4px 6px;border-radius:999px;background:var(--berry);color:#fff;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--berry-d)}
.who img{width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:#fff}
.who.bun{background:var(--sky-d);box-shadow:0 3px 0 #3f6eb3}
.who.nar{display:none}
#line{margin:6px 0 0;font-size:17px;line-height:1.75;min-height:3.5em;color:var(--cocoa)}
.dialog.nar #line{color:var(--cocoa-2);font-style:italic}
.dialog.thought #line{color:#4469a3}
.more{position:absolute;right:16px;bottom:8px;color:var(--berry);font-size:13px;animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(3px)}}
.side-bun{position:absolute;left:-6px;bottom:100%;width:118px;margin-bottom:-14px;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(60,80,140,.25));z-index:2}
.choices{display:flex;flex-direction:column;gap:10px}
.choices button{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:13px 16px;text-align:left;font-size:16px;box-shadow:0 4px 0 #efbcc6;display:flex;align-items:center;gap:10px}
.choices button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sky);flex:none;box-shadow:0 0 0 3px #e3ecfa}
.choices button:active{transform:translateY(2px);box-shadow:0 2px 0 #efbcc6}
.name-box{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #efbcc6}
.name-box label{font-family:var(--f-display);font-size:17px}
.name-row{display:flex;gap:8px}
.name-row input{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--cocoa)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{font-size:13px;padding:4px 10px;border-radius:999px;background:#eaf1fc;color:var(--sky-d)}

/* overlay cards */
.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(91,59,62,.32);padding:20px max(16px,env(safe-area-inset-left,0px));animation:fade .3s}
@keyframes fade{from{opacity:0}}
.card{background:var(--paper);border-radius:28px;padding:22px 20px;width:min(100%,380px);text-align:center;box-shadow:0 8px 0 #efbcc6,0 20px 50px rgba(90,40,60,.25);display:flex;flex-direction:column;gap:12px;align-items:center;max-height:100%;overflow:auto}
.card h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;color:var(--berry-d);text-wrap:balance}
.card .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--cocoa-2)}
.card p{margin:0;line-height:1.7;color:var(--cocoa-2)}
.card .frame{width:min(62%,30vh)}
.card .row{display:flex;gap:10px;width:100%}
.card .row .btn{flex:1}

/* home */
.meter{display:flex;flex-direction:column;gap:4px;min-width:0}
.meter b{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--berry-d);white-space:nowrap}
.meter .track{height:8px;border-radius:9px;background:#fff;border:1.5px solid var(--line);overflow:hidden}
.meter .fill{height:100%;background:linear-gradient(90deg,#f6a5b8,var(--berry));border-radius:9px;transition:width .6s}
.home-mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.bubble{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:12px 16px;max-width:min(100%,360px);font-size:16px;line-height:1.65;text-align:center;box-shadow:0 4px 0 #efbcc6}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:var(--paper);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bubble small{display:block;font-family:var(--f-display);color:var(--berry-d);font-size:13px;margin-bottom:2px}
#homeFrame{cursor:pointer}
.home-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 #efbcc6;font-size:14px}
.tile img{width:46px;height:40px;object-fit:contain}
.tile:active{transform:translateY(2px);box-shadow:0 2px 0 #efbcc6}
.next-story{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px;background:var(--berry);color:#fff;border-color:var(--berry);box-shadow:0 4px 0 var(--berry-d);font-family:var(--f-display);font-size:17px;padding:12px}
.next-story img{width:40px;height:34px}
.topics{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.topics button{background:#fff;border:2px solid var(--line);border-radius:999px;padding:9px 14px;font-size:15px}
.hearts-burst{position:absolute;pointer-events:none;z-index:30;color:var(--berry);animation:rise 1.1s ease-out forwards}
@keyframes rise{to{transform:translateY(-90px) scale(1.4);opacity:0}}

/* lists */
.list{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.ch-item{display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:10px 14px 10px 10px;box-shadow:0 4px 0 #efbcc6;text-align:left;width:100%}
.ch-item .thumb{width:64px;height:64px;border-radius:16px;background:var(--frame);overflow:hidden;flex:none}
.ch-item .thumb img{width:100%;height:100%;object-fit:cover}
.ch-item .tx{flex:1;min-width:0}
.ch-item small{color:var(--cocoa-2);font-size:12px;letter-spacing:.1em}
.ch-item b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px}
.ch-item .st{font-size:12px;color:var(--berry-d);white-space:nowrap}
.ch-item.locked{opacity:.55}
.ch-item.locked .thumb img{filter:grayscale(1) brightness(1.3) blur(3px)}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;padding:9px;border-radius:14px;background:#fff8;border:2px solid transparent;font-family:var(--f-display);font-size:16px}
.tabs button[aria-selected=true]{background:var(--paper);border-color:var(--line);color:var(--berry-d)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-bottom:16px}
.alb{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12px;color:var(--cocoa-2);text-align:center}
.alb .ph{width:100%;aspect-ratio:1;border-radius:13px;background:var(--frame);display:grid;place-items:center;overflow:hidden}
.alb .ph img{width:100%;height:100%;object-fit:contain}
.alb.bunny .ph{background:#e6eefb}
.alb.bunny .ph img{width:86%;height:86%}
.alb.lock .ph{background:#f4e6e6;color:#d6b4b8;font-family:var(--f-display);font-size:28px}
.alb .cap{line-height:1.35;min-height:2.7em}
.alb .cap b{display:block;color:var(--cocoa);font-weight:600}
.count{font-size:13px;color:var(--cocoa-2)}

/* game modal */
#gm{position:fixed;inset:0;z-index:50;background:linear-gradient(#fde7e7,#f5cfd4);display:flex;flex-direction:column;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px))}
#gm .bar{max-width:900px;width:100%;margin:0 auto}
#gmStat{font-variant-numeric:tabular-nums}
#gmBody{flex:1;min-height:0;position:relative;max-width:900px;width:100%;margin:8px auto 0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#gmBody canvas{display:block;border-radius:20px;border:4px solid #fff;box-shadow:0 8px 24px rgba(120,50,70,.18);touch-action:none;background:#fff}
.gpanel{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:rgba(253,231,231,.7);backdrop-filter:blur(3px)}
.rules{list-style:none;padding:0;margin:0;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--cocoa);font-size:14px}
.rules li{display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.rules li::before{content:"";width:8px;height:8px;margin-top:.55em;border-radius:50%;background:var(--berry);flex:none}
.big-score{font-family:var(--f-display);font-size:40px;color:var(--berry-d);line-height:1}

/* platformer */
.pf{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.pf canvas{width:min(100%,calc((100dvh - 210px)*16/9));aspect-ratio:16/9;height:auto}
.pad{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:640px;gap:12px}
.pad .lr{display:flex;gap:12px}
.pad button{width:72px;height:64px;border-radius:20px;background:var(--paper);border:2px solid var(--line);box-shadow:0 4px 0 #efbcc6;font-size:22px;color:var(--berry-d);touch-action:none}
.pad button.on{transform:translateY(3px);box-shadow:0 1px 0 #efbcc6;background:#ffe9ee}
.pad .jb{width:96px;font-family:var(--f-display);font-size:22px;background:var(--sky-d);color:#fff;border-color:var(--sky-d);box-shadow:0 4px 0 #3f6eb3}
.kb{margin:0;font-size:12px;color:var(--cocoa-2)}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
@media (hover:none),(pointer:coarse){.kb{display:none}}

/* catch */
.ct canvas{height:min(100%,640px);max-width:100%;aspect-ratio:3/4;width:auto}
.ct{height:100%;width:100%;display:flex;justify-content:center;align-items:center}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(100%,520px,calc((100dvh - 150px)*1.25))}
@media (max-width:480px){.mem{grid-template-columns:repeat(3,1fr);width:min(100%,calc((100dvh - 150px)*.68))}}
.mc{aspect-ratio:3/4;perspective:600px;padding:0}
.mc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.f .in,.mc.m .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid #fff;box-shadow:0 4px 0 #efbcc6}
.mc .ba{background:repeating-linear-gradient(45deg,#f7b9c6 0 8px,#f9c9d3 8px 16px);display:grid;place-items:center}
.mc .ba::after{content:"";width:40%;aspect-ratio:1;border-radius:50%;background:#fff8}
.mc .fa{background:var(--frame);transform:rotateY(180deg);overflow:hidden;display:grid;place-items:center}
.mc .fa img{width:100%;height:100%;object-fit:contain}
.mc .fa.bn{background:#e6eefb}
.mc .fa.bn img{width:86%;height:86%}
.mc.m .fa{border-color:var(--butter)}

/* shell */
.shell{width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:22px}
.sh-msg{font-family:var(--f-display);font-size:20px;margin:0;min-height:1.5em;text-align:center;color:var(--cocoa)}
.sh-row{position:relative;width:100%;height:clamp(140px,34vw,190px)}
.slot{position:absolute;left:0;bottom:0;width:30%;height:100%;transform:translateX(calc(var(--p)*116.66%));transition:transform var(--d,.35s) ease-in-out;padding:0}
.slot.lift{z-index:2}
.slot .candy{position:absolute;left:50%;bottom:6px;width:46%;transform:translateX(-50%)}
.cover{position:absolute;inset:auto 0 0 0;height:78%;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.slot.up .cover{transform:translateY(-62%) rotate(-4deg)}
.cover .bx{position:absolute;inset:16% 4% 0;background:linear-gradient(#f7b3c1,#f29db0);border-radius:6px 6px 10px 10px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.05),0 6px 0 #d97f95}
.cover .bx::after{content:"";position:absolute;left:50%;top:38%;width:30%;aspect-ratio:1;transform:translateX(-50%);background:radial-gradient(circle at 50% 60%,#fff 0 46%,transparent 47%);opacity:.85}
.cover .lid{position:absolute;left:0;right:0;top:0;height:22%;background:#f8c1cd;border-radius:6px;box-shadow:0 3px 0 #e48ea3}
.shell.pick .slot{cursor:pointer}
.shell.pick .slot:hover .cover{transform:translateY(-6px)}
.slot.right .cover .bx{box-shadow:0 0 0 4px var(--butter),0 6px 0 #d97f95}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;box-shadow:0 4px 0 #efbcc6;animation:tin 2.2s forwards;white-space:nowrap}
#toast div.aff{color:var(--berry-d);font-family:var(--f-display);font-size:16px}
@keyframes tin{0%{opacity:0;transform:translateY(-8px)}12%,80%{opacity:1;transform:none}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<div id="app">
  <!-- title -->
  <section id="title" class="screen stage" data-bg="love">
    <div class="decor" data-kind="love"></div>
    <div class="title-art"><div class="frame bob"><img id="tImg" alt="小妍抱着蓝兔子"></div><img class="peek" id="tPeek" alt=""></div>
    <h1>小妍与蓝兔</h1>
    <p>下雨天，一只蓝色的小兔子躲在纸箱里。<br>然后，一个叫小妍的女孩停下了脚步。</p>
    <div class="acts" id="tActs"></div>
  </section>

  <!-- home -->
  <section id="home" class="screen stage" data-bg="morning" hidden>
    <div class="decor" id="homeDecor"></div>
    <header class="bar">
      <div class="meter grow"><b id="lvName"></b><div class="track"><div class="fill" id="lvFill"></div></div></div>
      <span class="chip" id="streak"></span>
      <button class="chip" id="sndBtn" aria-label="声音"><svg class="ic"><use href="#snd"/></svg></button>
    </header>
    <div class="home-mid">
      <div class="bubble" id="homeBubble"><small>小妍</small><span id="homeSay"></span></div>
      <div class="frame" id="homeFrame" role="button" aria-label="蹭蹭小妍"><img id="homeImg" alt="小妍"></div>
    </div>
    <div class="home-acts" id="homeActs"></div>
  </section>

  <!-- chapters -->
  <section id="chapters" class="screen scroll" hidden>
    <header class="bar"><button class="chip" data-go="home"><svg class="ic"><use href="#back"/></svg>小屋</button><span class="ttl grow">我们的故事</span></header>
    <div class="list" id="chList"></div>
  </section>

  <!-- album -->
  <section id="album" class="screen scroll" hidden>
    <header class="bar"><button class="chip" data-go="home"><svg class="ic"><use href="#back"/></svg>小屋</button><span class="ttl grow">回忆相册</span><span class="count" id="albCount"></span></header>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="xy">小妍</button><button role="tab" aria-selected="false" data-tab="bun">兔兔</button></div>
    <div class="grid" id="albGrid"></div>
  </section>

  <!-- games -->
  <section id="games" class="screen scroll" hidden>
    <header class="bar"><button class="chip" data-go="home"><svg class="ic"><use href="#back"/></svg>小屋</button><span class="ttl grow">一起玩</span></header>
    <div class="list" id="gList"></div>
  </section>

  <!-- story -->
  <section id="story" class="screen stage" data-bg="rain" hidden>
    <div class="decor" id="stDecor"></div>
    <header class="bar">
      <button class="chip" id="stBack"><svg class="ic"><use href="#back"/></svg>小屋</button>
      <span class="ttl grow" id="stTitle"></span>
      <span class="chip" id="stAff"><svg class="ic" style="color:var(--berry)"><use href="#heart"/></svg><span></span></span>
    </header>
    <div class="st-mid"><div class="frame" id="stFrame"><img id="stImg" alt=""></div></div>
    <div id="stBottom">
      <div class="dialog" id="dlg" tabindex="0">
        <img class="side-bun" id="sideBun" alt="" hidden>
        <div class="who" id="who"><img id="whoAv" alt=""><span id="whoName"></span></div>
        <p id="line"></p><span class="more" id="more">▼</span>
      </div>
      <div class="choices" id="choices" hidden></div>
      <div class="name-box" id="nameBox" hidden>
        <label for="nameIn">给小兔子起个名字吧</label>
        <div class="name-row"><input id="nameIn" maxlength="8" autocomplete="off"><button class="btn" id="nameOk">就叫这个</button></div>
        <div class="sugg" id="sugg"></div>
      </div>
    </div>
  </section>
</div>

<div id="gm" hidden>
  <header class="bar"><span class="ttl" id="gmTitle"></span><span class="chip grow" id="gmStat" style="justify-content:center"></span><button class="chip" id="gmClose" aria-label="关闭"><svg class="ic"><use href="#x"/></svg></button></header>
  <div id="gmBody"></div>
</div>

/* ---------- sound ---------- */
let AC=null;
function sfx(k){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
 const m={tap:[700,.06,'sine',.05],jump:[440,.13,'triangle',.07],coin:[988,.12,'triangle',.06],pop:[520,.14,'sine',.08],hurt:[200,.22,'sawtooth',.04],boing:[260,.3,'sine',.09],win:[660,.5,'triangle',.07],ice:[1400,.15,'sine',.04]}[k]||[600,.08,'sine',.05];
 o.type=m[2];o.frequency.setValueAtTime(m[0],t);if(k==='jump'||k==='boing'||k==='pop')o.frequency.exponentialRampToValueAtTime(m[0]*2,t+m[1]);if(k==='coin')o.frequency.setValueAtTime(m[0]*1.5,t+.05);
 if(k==='win'){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.12);o.frequency.setValueAtTime(1046,t+.24)}if(k==='hurt')o.frequency.exponentialRampToValueAtTime(90,t+m[1]);
 g.gain.setValueAtTime(m[3],t);g.gain.exponentialRampToValueAtTime(.0001,t+m[1]);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+m[1]+.03)}catch(e){}}

/* ---------- story engine ---------- */
const story={ch:0,q:[],rating:null,typing:null,full:'',busy:false,gain:0,replay:false};
function startChapter(i){const c=CH[i];story.ch=i;story.q=c.nodes.slice();story.rating=null;story.gain=0;story.replay=i<S.cleared;
 go('story');const st=$('#story');st.dataset.bg=c.bg;decor($('#stDecor'),c.bg);$('#stTitle').textContent=`第${CN[i]}章 · ${c.t}`;
 $('#stFrame').hidden=true;$('#sideBun').hidden=true;$('#choices').hidden=true;$('#nameBox').hidden=true;$('#dlg').hidden=false;$('#line').textContent='';refreshAff();
 const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="card"><span class="eyebrow">第${CN[i]}章${story.replay?' · 重温':''}</span><h2>${c.t}</h2><button class="btn">开始</button></div>`;
 st.appendChild(ov);ov.querySelector('button').onclick=()=>{sfx('tap');ov.remove();next()}}
function setPortrait(k){const f=$('#stFrame'),img=$('#stImg');f.hidden=false;f.classList.toggle('solo',k.startsWith('b_'));img.src=ST[k];img.alt=k.startsWith('b_')?'蓝兔子':'小妍';f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop');unlock(k)}
function say(kind,text,e){const d=$('#dlg'),who=$('#who');d.className='dialog'+(kind==='n'?' nar':kind==='b'?' thought':'');
 who.className='who'+(kind==='n'?' nar':kind==='b'?' bun':'');
 if(kind==='x'){$('#whoAv').src=ST.av_xy;$('#whoName').textContent='小妍'}
 if(kind==='b'){$('#whoAv').src=ST.b_peek;$('#whoName').textContent=S.name}
 const sb=$('#sideBun');if(kind==='b'&&e){sb.src=ST[e];sb.hidden=false;sb.classList.remove('pop');void sb.offsetWidth;sb.classList.add('pop');unlock(e)}else sb.hidden=true;
 story.full=fmt(kind==='b'?'（'+text+'）':text);const el=$('#line');el.textContent='';$('#more').hidden=true;let i=0;clearInterval(story.typing);
 story.typing=setInterval(()=>{i++;el.textContent=story.full.slice(0,i);if(i>=story.full.length){clearInterval(story.typing);story.typing=null;$('#more').hidden=false}},32)}
function advance(){if(!$('#choices').hidden||!$('#nameBox').hidden||$('#story .overlay'))return;
 if(story.typing){clearInterval(story.typing);story.typing=null;$('#line').textContent=story.full;$('#more').hidden=false;return}
 sfx('tap');next()}
$('#dlg').addEventListener('click',advance);
$('#story .st-mid').addEventListener('click',advance);
$('#dlg').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance()}});
document.addEventListener('keydown',e=>{if(!$('#story').hidden&&$('#gm').hidden&&e.target.tagName!=='INPUT'&&(e.key===' '||e.key==='Enter')&&e.target.id!=='dlg'){e.preventDefault();advance()}});
function gain(n){if(story.replay||!n)return;story.gain+=n;addAff(n)}
function next(){const n=story.q.shift();if(!n)return endChapter();
 if(n.if&&n.if!==story.rating)return next();
 if(n.p)setPortrait(n.p);
 if(n.fin){if(!story.replay&&S.aff<45){const d=45-S.aff;story.gain+=d;addAff(d,true)}S.done=true;save();return next()}
 if(n.c)return showChoices(n.c);
 if(n.g){$('#dlg').hidden=true;return openGame(n.g,true,r=>{story.rating=r.great?'great':'ok';$('#dlg').hidden=false;gain(r.great?3:1);next()})}
 if(n.name)return askName();
 if(n.x)return say('x',n.x);if(n.b)return say('b',n.b,n.e);if(n.n)return say('n',n.n);
 next()}
function showChoices(cs){const box=$('#choices');box.innerHTML='';$('#dlg').hidden=true;box.hidden=false;
 cs.forEach(c=>{const b=document.createElement('button');b.textContent=fmt(c.t);b.onclick=()=>{sfx('pop');box.hidden=true;$('#dlg').hidden=false;gain(c.a);story.q.unshift(...c.r);next()};box.appendChild(b)});box.querySelector('button').focus()}
function askName(){$('#dlg').hidden=true;const nb=$('#nameBox');nb.hidden=false;const inp=$('#nameIn');inp.value=S.name==='蓝莓'?'':S.name;inp.placeholder='蓝莓';
 $('#sugg').innerHTML=['蓝莓','团子','棉花糖','小蓝','咕噜'].map(s=>`<button>${s}</button>`).join('');
 $$('#sugg button').forEach(b=>b.onclick=()=>{inp.value=b.textContent;sfx('tap')});
 const ok=()=>{const v=inp.value.trim().slice(0,8)||'蓝莓';S.name=v;save();nb.hidden=true;$('#dlg').hidden=false;sfx('pop');next()};
 $('#nameOk').onclick=ok;inp.onkeydown=e=>{if(e.key==='Enter')ok()};setTimeout(()=>inp.focus(),50)}
function endChapter(){const i=story.ch;const first=!story.replay;if(first){S.cleared=Math.max(S.cleared,i+1);save()}
 const last=i===CH.length-1;const ov=document.createElement('div');ov.className='overlay';
 if(last){ov.innerHTML=`<div class="card"><span class="eyebrow">主线 · 完</span><div class="frame"><img src="${ST.s00}" alt="小妍抱着兔子"></div><h2>我们在一起啦</h2><p>${story.gain?`这一章好感 +${story.gain}<br>`:''}从今天起，每天都可以回小屋看看小妍。<br>她会根据时间，和 ${S.name} 说不一样的话。</p><div class="row"><button class="btn" data-a="home">回到小屋</button></div></div>`}
 else ov.innerHTML=`<div class="card"><span class="eyebrow">第${CN[i]}章 · 完</span><div class="frame"><img src="${ST[CH[i].thumb]}" alt=""></div><h2>${CH[i].t}</h2><p>${story.gain?`这一章好感 +${story.gain}`:story.replay?'重温完毕':''}</p><div class="row"><button class="btn soft" data-a="home">回小屋</button><button class="btn" data-a="next">下一章</button></div></div>`;
 $('#story').appendChild(ov);sfx('win');
 ov.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;sfx('tap');ov.remove();if(a.dataset.a==='next')startChapter(i+1);else go('home')})}
$('#stBack').onclick=()=>{sfx('tap');clearInterval(story.typing);$$('#story .overlay').forEach(o=>o.remove());if(S.cleared>0)go('home');else go('title')};

  const up=()=>{K[k]=0;b.classList.remove('on')};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('contextmenu',e=>e.preventDefault())});
 ['s24','s22','b_yay','b_star','b_shy'].forEach(img);raf=requestAnimationFrame(loop);
 return()=>{alive=false;cancelAnimationFrame(raf);removeEventListener('keydown',kd);removeEventListener('keyup',ku)}}

/* ---------- mini-game: catch ---------- */
function runCatch(el,api){
 el.innerHTML=`<div class="ct"><canvas width="720" height="960" aria-label="奶茶接接乐游戏画面"></canvas></div>`;
 const cv=el.querySelector('canvas'),c=cv.getContext('2d');c.scale(2,2);const VW=360,VH=480;
 const B={x:180,w:80,frz:0,tx:180};let items=[],score=0,time=30,alive=true,raf=0,last=0,spawn=0,parts=[];const K={L:0,R:0};
 const stat=()=>api.stat(`得分 ${score}　剩余 ${Math.ceil(time)} 秒`);stat();
 const mv=e=>{const r=cv.getBoundingClientRect();B.tx=clamp((e.clientX-r.left)/r.width*VW,30,VW-30)};
 cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);mv(e)});cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='mouse')mv(e)});
 const kd=e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')K.L=1;if(e.code==='ArrowRight'||e.code==='KeyD')K.R=1},ku=e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')K.L=0;if(e.code==='ArrowRight'||e.code==='KeyD')K.R=0};
 addEventListener('keydown',kd);addEventListener('keyup',ku);
 const HP=new Path2D('M12 21s-7.5-4.6-9.6-9.2C.8 8.3 2.9 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.5.8-1.3 2.3-2.5 4.4-2.5 3.7 0 5.8 3.8 4.2 7.3C19.5 16.4 12 21 12 21z');
 function step(dt){time-=dt;if(time<=0){alive=false;api.end({score,text:`${score} 分`,great:score>=35});return}
  if(K.L)B.tx=clamp(B.tx-6,30,VW-30);if(K.R)B.tx=clamp(B.tx+6,30,VW-30);
  if(B.frz>0)B.frz-=dt;else B.x+=(B.tx-B.x)*.35;
  spawn-=dt;const prog=1-time/30;if(spawn<=0){spawn=.55-prog*.28;const r=Math.random();items.push({x:20+Math.random()*(VW-40),y:-14,v:2.1+prog*2.2+Math.random()*.8,t:r<.68?'p':r<.82?'h':'i',rot:Math.random()*6})}
  for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.v;it.rot+=.04;
   if(it.y>VH-92&&it.y<VH-60&&Math.abs(it.x-B.x)<34){items.splice(i,1);
    if(it.t==='p'){score++;sfx('coin')}else if(it.t==='h'){score+=3;sfx('pop');for(let k=0;k<5;k++)parts.push({x:it.x,y:it.y,vx:(Math.random()-.5)*3,vy:-2-Math.random()*2,l:40})}else{score=Math.max(0,score-2);B.frz=.7;sfx('ice')}
    stat();continue}
   if(it.y>VH+20)items.splice(i,1)}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.1;if(--p.l<=0)parts.splice(i,1)}
  if(Math.floor(time*10)%10===0)stat()}
 function draw(){const g=c.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#fff3e6');g.addColorStop(1,'#ffd7dc');c.fillStyle=g;c.fillRect(0,0,VW,VH);
  for(let i=0;i<10;i++){c.fillStyle=i%2?'#fff':'#f6a5b8';c.fillRect(i*36,0,36,34);c.beginPath();c.arc(i*36+18,34,18,0,Math.PI);c.fill()}
  c.fillStyle='rgba(247,184,198,.35)';c.fillRect(0,VH-40,VW,40);
  for(const it of items){c.save();c.translate(it.x,it.y);
   if(it.t==='p'){c.fillStyle='#4a2b25';c.beginPath();c.arc(0,0,9,0,7);c.fill();c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.arc(-3,-3,3,0,7);c.fill()}
   else if(it.t==='h'){c.translate(-12,-12);c.fillStyle='#f0708e';c.fill(HP)}
   else{c.rotate(it.rot);c.fillStyle='rgba(200,230,255,.9)';c.strokeStyle='#8fbbe8';c.lineWidth=2;c.beginPath();c.roundRect(-10,-10,20,20,5);c.fill();c.stroke();c.fillStyle='#fff';c.fillRect(-6,-6,5,3)}
   c.restore()}
  for(const p of parts){c.save();c.translate(p.x,p.y);c.scale(.5,.5);c.translate(-12,-12);c.globalAlpha=p.l/40;c.fillStyle='#f0708e';c.fill(HP);c.restore()}
  const bi=img(B.frz>0?'b_shy':'b_boba');if(bi.complete){const w=92,h=w*bi.naturalHeight/bi.naturalWidth;c.save();c.translate(B.x,VH-14);if(B.frz>0)c.translate(Math.sin(performance.now()*.08)*2,0);c.drawImage(bi,-w/2,-h,w,h);
   if(B.frz>0){c.fillStyle='rgba(180,220,255,.45)';c.beginPath();c.roundRect(-w/2,-h,w,h,20);c.fill()}c.restore()}
  if(time<4){c.fillStyle='#c75f7a';c.font='bold 48px "ZCOOL KuaiLe",sans-serif';c.textAlign='center';c.globalAlpha=.6;c.fillText(Math.ceil(time),VW/2,VH/2);c.globalAlpha=1;c.textAlign='left'}}
 function loop(t){if(!alive)return;if(!last)last=t;const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);if(!alive)return;draw();raf=requestAnimationFrame(loop)}
 img('b_boba');img('b_shy');raf=requestAnimationFrame(loop);
 return()=>{alive=false;cancelAnimationFrame(raf);removeEventListener('keydown',kd);removeEventListener('keyup',ku)}}

/* ---------- mini-game: memory ---------- */
function runMemory(el,api){const keys=['s02','s04','s20','b_heart','b_carrot','b_music'];const deck=[...keys,...keys].sort(()=>Math.random()-.5);
 el.innerHTML=`<div class="mem">${deck.map((k,i)=>`<button class="mc" data-i="${i}" aria-label="卡片"><div class="in"><div class="ba"></div><div class="fa${k.startsWith('b_')?' bn':''}"><img src="${ST[k]}" alt=""></div></div></button>`).join('')}</div>`;
 let open=[],moves=0,pairs=0,lock=false,alive=true;const tm=[];const stat=()=>api.stat(`步数 ${moves}　配对 ${pairs}/6`);stat();
 el.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{if(lock||b.classList.contains('f')||b.classList.contains('m'))return;b.classList.add('f');sfx('tap');open.push(b);
  if(open.length===2){moves++;const[a,c]=open;open=[];
   if(deck[a.dataset.i]===deck[c.dataset.i]){a.classList.add('m');c.classList.add('m');pairs++;sfx('coin');stat();if(pairs===6)tm.push(setTimeout(()=>alive&&api.end({score:moves,text:`${moves} 步`,great:moves<=11}),700))}
   else{lock=true;stat();tm.push(setTimeout(()=>{a.classList.remove('f');c.classList.remove('f');lock=false},750))}}});
 return()=>{alive=false;tm.forEach(clearTimeout)}}

/* ---------- boot ---------- */
['b_peek','av_xy','s00'].forEach(img);
go('title');
</script>
